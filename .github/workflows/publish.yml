name: Publish Container Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 0.1.2)'
        required: false
        default: '0.1.2'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  security-gate:
    name: Pre-Publish DevSecOps Trivy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Vulnerability Audit
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: dropinlabs/drop-relay:pre-publish-audit

      - name: Enforce Zero Critical & High Findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'dropinlabs/drop-relay:pre-publish-audit'
          trivy-config: 'trivy.yaml'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  publish:
    name: Build & Push Multi-Arch Image to GHCR
    runs-on: ubuntu-latest
    needs: [security-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version || '0.1.2' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=drop-relay
            org.opencontainers.image.description=High-throughput, sovereign mail transfer agent (MTA), automated OpenDKIM signing engine, and inbound webhook delivery proxy for modern container architectures.
            org.opencontainers.image.url=https://github.com/dropin-labs/drop-relay
            org.opencontainers.image.source=https://github.com/dropin-labs/drop-relay
            org.opencontainers.image.documentation=https://github.com/dropin-labs/drop-relay#readme
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
